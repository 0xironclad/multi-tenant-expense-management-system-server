version: '3.9'

services:
# db and storage services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-receipts};
      echo 'Bucket ready.';
      "

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'

  # ─── Services ────────────────────────────────────────────────────────────────

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      SERVICE_NAME: auth
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  user-org:
    build:
      context: .
      dockerfile: services/user-org/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${USER_ORG_DATABASE_URL}
      SERVICE_NAME: user-org
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy

  expense:
    build:
      context: .
      dockerfile: services/expense/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${EXPENSE_DATABASE_URL}
      SERVICE_NAME: expense
      USER_ORG_SERVICE_URL: http://user-org:3002
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
      SERVICE_NAME: notification
      USER_ORG_SERVICE_URL: http://user-org:3002
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-org:
        condition: service_started

  file:
    build:
      context: .
      dockerfile: services/file/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${FILE_DATABASE_URL}
      SERVICE_NAME: file
      # S3_ENDPOINT comes from .env (http://localhost:9000). The file service only
      # *signs* URLs (a local computation) — it never connects to S3/MinIO itself.
      # The signed host is baked into the SigV4 signature, so it must be reachable
      # by the CLIENT that uses the URL, not by this container.
      USER_ORG_SERVICE_URL: http://user-org:3002
    ports:
      - '3005:3005'
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: gateway
      AUTH_SERVICE_URL: http://auth:3001
      USER_ORG_SERVICE_URL: http://user-org:3002
      EXPENSE_SERVICE_URL: http://expense:3003
      FILE_SERVICE_URL: http://file:3005
    ports:
      - '3000:3000'
    depends_on:
      - auth
      - user-org
      - expense
      - file

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
